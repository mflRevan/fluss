name: Release

# Ship:  powershell -File scripts\bump-version.ps1 0.2.0, commit, then
#        git tag v0.2.0 && git push origin main v0.2.0
#  - checks the tag matches the version in Cargo.toml
#  - builds the Windows installer and attaches it to a GitHub release
#  - writes site/update.json (the in-app update feed) from that release and
#    deploys site/ to Vercel production (needs the VERCEL_TOKEN repo secret)
# The site can also be redeployed on its own: Actions -> Release -> "Run workflow".
# To mark old versions unsupported, edit min_supported/message in site/update.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VERCEL_ORG_ID: team_SpVuedVmeAleyEtcnX7GWB6G
  VERCEL_PROJECT_ID: prj_8JJs6DytmVIoTDD9P8Wh16R9syoi

jobs:
  site:
    name: website (vercel)
    # After the installer, so the update feed points at a release that exists.
    needs: installer
    if: ${{ !cancelled() && (needs.installer.result == 'success' || needs.installer.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update feed from the latest release
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          url=$(jq -r '[.assets[] | select(.name | endswith("_x64-setup.exe"))][0].browser_download_url // empty' <<<"$rel")
          [ -n "$url" ] || { echo "::error::latest release has no *_x64-setup.exe"; exit 1; }
          sha=$(jq -r '[.assets[] | select(.name | endswith("_x64-setup.exe"))][0].digest // "" | ltrimstr("sha256:")' <<<"$rel")
          [ -n "$sha" ] || sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          # min_supported and message are hand-edited in the committed file and kept as they are.
          jq --argjson rel "$rel" --arg url "$url" --arg sha "$sha" '
            ([$rel.assets[] | select(.name | endswith("_x64-setup.exe"))][0]) as $a
            | .version = ($rel.tag_name | ltrimstr("v"))
            | .url = $url | .sha256 = $sha | .size = $a.size
            | .notes = $rel.html_url | .date = $rel.published_at[0:10]' update.json > update.next
          mv update.next update.json
          cat update.json
      - name: Deploy to production
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is missing (gh secret set VERCEL_TOKEN); website not deployed"; exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

  installer:
    name: windows installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $v (run scripts/bump-version.ps1)"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build installer
        run: powershell -File scripts\build-installer.ps1
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe=$(ls target/release/bundle/nsis/*-setup.exe)
          # A stable name too, so the website can link releases/latest/download/Fluss-setup.exe
          cp "$exe" target/release/bundle/nsis/Fluss-setup.exe
          gh release create "$GITHUB_REF_NAME" "$exe" target/release/bundle/nsis/Fluss-setup.exe \
            --title "Fluss ${GITHUB_REF_NAME#v}" --generate-notes
