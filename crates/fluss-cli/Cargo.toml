[package]
name = "fluss-cli"
description = "Command line interface for Fluss"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fluss"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0.12"

[dependencies]
fluss-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
