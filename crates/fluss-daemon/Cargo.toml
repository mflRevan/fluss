[package]
name = "fluss-daemon"
description = "Fluss background service: hotkeys, audio, speech engines, text insertion, overlay, tray"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fluss-daemon"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0.12"

[dependencies]
fluss-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
interprocess.workspace = true
cpal = "0.18.2"
ureq = "3.4.2"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
fontdue = "0.9.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# ONNX Runtime is loaded at runtime (only when the Parakeet engine is used).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"] }
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }
